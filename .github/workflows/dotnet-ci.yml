name: .NET CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and validate architecture
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: implementations/dotnet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore reference implementation
        run: dotnet restore Grounded.Hexagonal.slnx

      - name: Build reference implementation
        run: dotnet build Grounded.Hexagonal.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: >
          dotnet test Grounded.Hexagonal.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=grounded-tests.trx"
          --results-directory TestResults

      - name: Verify EF Core model matches migrations
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Grounded.Hexagonal.Adapters.Outbound.Persistence
          --startup-project src/Grounded.Hexagonal.Adapters.Outbound.Persistence

      - name: Restore Visualizer
        run: dotnet restore tools/Grounded.Hexagonal.Visualizer/Grounded.Hexagonal.Visualizer.csproj

      - name: Build Visualizer
        run: >
          dotnet build
          tools/Grounded.Hexagonal.Visualizer/Grounded.Hexagonal.Visualizer.csproj
          --configuration Release
          --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: implementations/dotnet/TestResults/**/*.trx
          if-no-files-found: warn
