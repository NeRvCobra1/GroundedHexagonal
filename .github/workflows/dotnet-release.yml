name: .NET Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release packages
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: implementations/dotnet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore Grounded.Hexagonal.slnx

      - name: Build solution
        run: dotnet build Grounded.Hexagonal.slnx --configuration Release --no-restore

      - name: Test solution
        run: dotnet test Grounded.Hexagonal.slnx --configuration Release --no-build

      - name: Verify EF Core migrations
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Grounded.Hexagonal.Adapters.Outbound.Persistence
          --startup-project src/Grounded.Hexagonal.Adapters.Outbound.Persistence

      - name: Publish API
        run: >
          dotnet publish
          src/Grounded.Hexagonal.Host.Api/Grounded.Hexagonal.Host.Api.csproj
          --configuration Release
          --output artifacts/api

      - name: Publish Worker
        run: >
          dotnet publish
          src/Grounded.Hexagonal.Host.Worker/Grounded.Hexagonal.Host.Worker.csproj
          --configuration Release
          --output artifacts/worker

      - name: Publish Visualizer
        run: >
          dotnet publish
          tools/Grounded.Hexagonal.Visualizer/Grounded.Hexagonal.Visualizer.csproj
          --configuration Release
          --output artifacts/visualizer

      - name: Package release artifacts
        shell: bash
        run: |
          cd artifacts
          zip -r "Grounded.Hexagonal.Api-${GITHUB_REF_NAME}.zip" api
          zip -r "Grounded.Hexagonal.Worker-${GITHUB_REF_NAME}.zip" worker
          zip -r "Grounded.Hexagonal.Visualizer-${GITHUB_REF_NAME}.zip" visualizer

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: grounded-hexagonal-${{ github.ref_name }}
          path: |
            implementations/dotnet/artifacts/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             artifacts/*.zip             --title "Grounded Hexagonal Architecture ${GITHUB_REF_NAME}"             --generate-notes
